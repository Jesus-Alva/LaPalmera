services:
  # Backend Services
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fastapi-la-palmera-dev
    env_file: .env.dev   # Opcional: archivo específico para desarrollo
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://lapalmera:palmera@postgres:5432/lapalmera
      - ENV=container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    # Sin restart policy en desarrollo para que los errores sean visibles
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # Usa el archivo específico para desarrollo
    container_name: frontend-la-palmera-dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - API_URL_INTERNAL=http://web:8000/api/v1
      - ENV=container
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    command: npm run dev   # Sin --webpack para usar Turbopack (más rápido)
    networks:
      - app-network

  # Database & Infrastructure Services
  postgres:
    image: postgres:15
    container_name: postgres-palmera-dev
    env_file: .env.dev
    environment:
      - POSTGRES_USER=lapalmera
      - POSTGRES_PASSWORD=palmera
      - POSTGRES_DB=lapalmera
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapalmera -d lapalmera"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  # Entorno grafico para DB
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-palmera-dev
    env_file: .env.dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - postgres

volumes:
  postgres_data_dev:

networks:
  app-network:
    driver: bridge