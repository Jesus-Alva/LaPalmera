services:
  # Backend Services
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile   # Puedes usar el mismo Dockerfile (ya tiene --reload)
    container_name: fastapi-la-palmera-dev
    env_file: .env.dev   # Opcional: archivo específico para desarrollo
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    # Sin restart policy en desarrollo para que los errores sean visibles
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # Usa el archivo específico para desarrollo
    container_name: frontend-la-palmera-dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_BACKEND_API_URL=http://localhost:8000/api/v1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    command: npm run dev   # Sin --webpack para usar Turbopack (más rápido)
    networks:
      - app-network

  # Database & Infrastructure Services
  postgres:
    image: postgres:15
    container_name: postgres-palmera-dev
    env_file: .env.dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network
    # Sin healthcheck en desarrollo
  
  redis:
    image: redis:7-alpine
    container_name: redis-cache-palmera
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker-palmera
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - app-network
    depends_on:
      - redis
      - rabbitmq
  flower:
    image: mher/flower:latest
    container_name: flower-monitor
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery flower --broker=amqp://guest:guest@rabbitmq:5672// --port=5555
    ports:
      - "5555:5555"
    networks:
      - app-network
    depends_on:
      - rabbitmq
      - redis
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  app-network:
    driver: bridge