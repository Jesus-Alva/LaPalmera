# Compose de referencia para correr la app en modo producción (imágenes
# construidas, sin bind mounts ni auto-reload) — por ejemplo para autohospedarla
# en un VPS. Railway NO usa este archivo: cada servicio (backend/, frontend/)
# se despliega ahí directamente desde su propio Dockerfile + railway.toml.
# Ver .env.example para las variables que espera este archivo.
services:
  # Backend Services
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-la-palmera
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    # Sin `command:` ni bind mount de código: se usa la imagen ya construida,
    # cuyo ENTRYPOINT aplica las migraciones de Alembic antes de arrancar.
    volumes:
      - static_data:/app/static
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # worker:
