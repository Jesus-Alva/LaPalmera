  #     start_period: 40s

volumes:
  postgres_data:
  # Imágenes subidas (galería, banners, espacios, etc.). Sin este volumen, cada
  # `docker compose up --build` empieza con /app/static vacío y las imágenes
  # previamente subidas dejan de servirse aunque la BD siga referenciándolas.
  static_data:

networks:
  app-network:
    driver: bridge
