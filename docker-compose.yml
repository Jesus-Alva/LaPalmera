  #     - postgres
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dbname
  #   command: python -m app.schedulers.main
  #   volumes:
  #     - ./backend:/app
  #   restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Variables NEXT_PUBLIC_* que Next.js necesita "inlinear" en el bundle del
      # navegador durante `npm run build` (ver comentario en frontend/Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: frontend-la-palmera
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # URL interna para las peticiones que el propio servidor de Next.js (Server
      # Components, route handlers) le hace al backend dentro de la red de Docker.
      - API_URL_INTERNAL=http://web:8000/api/v1
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

  # Database & Infrastructure Services
  postgres:
    image: postgres:15
    container_name: postgres-palmera
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

