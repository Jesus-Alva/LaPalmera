# Compose de referencia para correr la app en modo producción (imágenes
# construidas, sin bind mounts ni auto-reload) — por ejemplo para autohospedarla
# en un VPS. Railway NO usa este archivo: cada servicio (backend/, frontend/)
# se despliega ahí directamente desde su propio Dockerfile + railway.toml.
# Ver .env.example para las variables que espera este archivo.
services:
  # Backend Services
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-la-palmera
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set for production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set for production}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENV=container
    # Sin `command:` ni bind mount de código: se usa la imagen ya construida,
    # cuyo ENTRYPOINT aplica las migraciones de Alembic antes de arrancar.
    volumes:
      - static_data:/app/static
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Variables NEXT_PUBLIC_* que Next.js necesita "inlinear" en el bundle del
      # navegador durante `npm run build` (ver comentario en frontend/Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set for production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set for production}
    container_name: frontend-la-palmera
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set for production}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set for production}
      # URL interna para las peticiones que el propio servidor de Next.js (Server
      # Components, route handlers) le hace al backend dentro de la red de Docker.
      - API_URL_INTERNAL=http://web:8000/api/v1
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Database & Infrastructure Services
  postgres:
    image: postgres:15
    container_name: postgres-palmera
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  # Imágenes subidas (galería, banners, espacios, etc.). Sin este volumen, cada
  # `docker compose up --build` empieza con /app/static vacío y las imágenes
  # previamente subidas dejan de servirse aunque la BD siga referenciándolas.
  static_data:

networks:
  app-network:
    driver: bridge
